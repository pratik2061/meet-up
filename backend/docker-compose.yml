services:
  # main backend docker image 
  meetup-backend:
    container_name: meetup-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: meetup-backend

    ports:
      - "3000:3000"

    env_file: .env

    depends_on:
      - meetup-mongo
      - meetup-redis
      - meetup-livekit

  # mongodb docker image
  meetup-mongo:
    container_name: meetup-mongo
    image: mongo:latest

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - meetup-db-volume:/data/db
    restart: unless-stopped

  # redis docker image
  meetup-redis:
    container_name: meetup-redis
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped

  # livekit docker service image
  meetup-livekit:
    container_name: meetup-livekit
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

volumes:
  meetup-db-volume:
